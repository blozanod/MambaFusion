# MF_STHAT_L5_BayerSpace — Bayer-domain restructure, 35k smoke test.
#
# Change under test vs. MF_STHAT_L3_SynBase:
#   1. PreAlign conv head + PixelShuffle x2 -> alignment, fusion and restoration
#      all run on the Bayer grid (96x96) instead of packed RGGB (48x48).
#      network_g.scale stays 8 (GT is 8x the packed LR); the restoration module
#      internally upsamples by scale // 2 = 4 because PreAlign already did x2.
#   2. ST-HAT stage 3 reduced 3 -> 1 (redundant with the MambaIRv2 trunk).
#   3. embed_dim 48 -> 96, MambaIRv2 num_feat 64 -> 128 (reconstruction width),
#      and ST-HAT proj_out now emits embed_dim directly (no 96->64->96 waist).
#   4. Restoration residual is now the fused features, not ref_feats.
#
# Schedule is the fixed 35k smoke-test recipe: cosine 1e-4 -> 1e-6, warmup 2k.
# Effective batch is held at 32 (2 per GPU x 4 GPUs x 4 accumulation steps) so
# that 35k iterations here means the same optimizer steps AND the same number of
# sample presentations as the L3 reference at 35k. Do not change the effective
# batch without re-baselining: it is what makes the comparison valid.
name: MF_STHAT_L5_BayerSpace
model_type: MambaFusionModel
scale: 8
num_gpu: 4
manual_seed: 42
find_unused_parameters: false

# Dataset
datasets:
  train:
    name: SyntheticBurst_train
    type: SyntheticBurstDataset
    # Zurich RAW-to-RGB canon set root (expects <dataroot>/train/canon/*.jpg)
    dataroot: /groups/rls/blozanod/MambaFusion/dataset/Zurich-RAW-to-RGB
    num_frames: 14
    phase: train
    scale: 8
    # 2 (not 4) because the fusion stage now runs at 96x96: the stage-1
    # SpatioTemporalBlock attention matrix is B x 144 windows x 4 heads x 896^2.
    # If this still OOMs, go to 1 and raise accumulation_steps to 8 — that keeps
    # the effective batch at 32.
    batch_size_per_gpu: 2
    num_worker_per_gpu: 6
    dataset_enlarge_ratio: 1
    grad_clip_norm: 1

  val:
    name: SyntheticBurst_val
    type: SyntheticBurstDataset
    # Official pre-generated 300-burst val set (expects bursts/ and gt/)
    dataroot: /groups/rls/blozanod/MambaFusion/dataset/SyntheticBurstVal
    num_frames: 14
    phase: val
    scale: 8

# Network
network_g:
  type: MambaFusionNet
  # General Config
  global_skip: false
  num_frames: 14
  img_size: 96  # post-PreAlign Bayer resolution seen by fusion + restoration
  num_feat: 64
  # Alignment Specific Config
  offset_groups: 4
  # Fusion Specific Config
  fusion_ws: 8
  fusion_feat: 96
  fusion_mlp_ratio: 4
  fusion_heads: 4
  fusion_overlap: 0.25
  fusion_depth_s1: 3
  fusion_depth_s3: 1
  # MambaIRv2 Specific Config
  embed_dim: 96
  d_state: 8
  scale: 8  # packed-LR -> GT ratio; restoration upsamples by scale // 2
  depths: [5, 5, 5, 5]
  num_heads: [4, 4, 4, 4]
  window_size: 16
  inner_rank: 32
  num_tokens: 64
  convffn_kernel_size: 5
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  is_train: true

# Training
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: ~

train:
  accumulation_steps: 4  # 2 x 4 GPUs x 4 = effective batch 32, matches L3
  total_iter: 35000
  warmup_iter: 2000
  compand: false  # plain L1 on linear RGB, no mu-law companding

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  # Cosine 1e-4 -> 1e-6 over the whole run, single period, no restart.
  # Replaces MultiStepLR, whose unset gamma defaulted to 0.1 and drove the L3
  # run down to 1e-7 for its last 15k iterations.
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [35000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  # No edge_opt: every nonstandard knob stays at its literature setting;
  # edge terms return later as labeled ablations.

# Validation
val:
  val_freq: 2500
  save_img: false
  metrics:
    psnr_synburst:  # headline: official SyntheticBurst eval (vendored DBSR code)
      type: calculate_psnr_synburst
      boundary_ignore: 40
      better: higher
    psnr_linear:  # ours, kept alongside
      type: calculate_psnr_linear
      crop_border: 40
      test_y_channel: false
      better: higher
    ssim:  # ours (linear-domain SSIM), kept alongside
      type: calculate_ssim
      crop_border: 40
      input_order: CHW  # visuals are [C,H,W]; calculate_ssim defaults to HWC
      test_y_channel: false
      better: higher

# Logging
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: false
