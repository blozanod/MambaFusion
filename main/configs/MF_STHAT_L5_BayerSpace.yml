# MF_STHAT_L5_BayerSpace — Bayer-domain restructure, 35k smoke test.
#
# Change under test vs. MF_STHAT_L3_SynBase:
#   1. PreAlign conv head + PixelShuffle x2 -> alignment, fusion and restoration
#      all run on the Bayer grid (96x96) instead of packed RGGB (48x48).
#      network_g.scale stays 8 (GT is 8x the packed LR); the restoration module
#      internally upsamples by scale // 2 = 4 because PreAlign already did x2.
#   2. ST-HAT stage 3 reduced 3 -> 1 (redundant with the MambaIRv2 trunk);
#      stage 1 stays at 3 — the fusion module is the contribution and is not
#      where capacity should be cut.
#   3. embed_dim 48 -> 96 (== fusion_feat, so ST-HAT proj_out emits it directly
#      and there is no channel waist into the restoration module).
#   4. MambaIRv2 depths [5,5,5,5] -> [2,2,2,2]. It is a refinement trunk after
#      the burst dimension has already collapsed, not the backbone, and
#      ST-HAT stage 3 already refines. Depth 2 per ASSB is also the minimum
#      that keeps BasicBlock's shift alternation (0, window_size // 2) intact.
#   5. d_state 8 -> 16. The selective scan is ~5% of an AttentiveLayer, so this
#      buys SSM state capacity for 58k parameters — the cheapest capacity in
#      the model.
#   6. upsample_feat 64 (not 128). At 96x96 the pre-upsample tensor is already
#      96*96*64 = 590k values against a 384*384*3 = 442k output (ratio 1.33,
#      over-complete). The wider tail was compensating for the starved 48x48
#      budget and is redundant in Bayer space.
#
#   7. SpatioTemporalBlock window 8 -> 4 (fusion_st_ws), split out from the
#      window used by the spatial, fusion and refinement blocks. Cuts the
#      dominant attention term 4x and probes residual misalignment.
#
# Total: ~5.02M, against 5.089M for L3. Split is PreAlign 3% / BurstAlign 17% /
# ST-HAT 34% / MambaIRv2 46%.
#
# Schedule is the fixed 35k smoke-test recipe: cosine 1e-4 -> 1e-6, warmup 2k.
# Effective batch is held at 32 (2 per GPU x 4 GPUs x 4 accumulation steps) so
# that 35k iterations here means the same optimizer steps AND the same number of
# sample presentations as the L3 reference at 35k. Do not change the effective
# batch without re-baselining: it is what makes the comparison valid.
#
# The packed-domain control is the same file with pre_align: false — see
# MF_STHAT_L5_PackedControl.yml. That is the one-variable ablation for the
# domain change; it is NOT a re-run of L3 (which also differed in depths,
# embed_dim and the reference residual).
name: MF_STHAT_L5_BayerSpace
model_type: MambaFusionModel
scale: 8
num_gpu: 4
manual_seed: 42
find_unused_parameters: false

# Dataset
datasets:
  train:
    name: SyntheticBurst_train
    type: SyntheticBurstDataset
    # Zurich RAW-to-RGB canon set root (expects <dataroot>/train/canon/*.jpg)
    dataroot: /groups/rls/blozanod/MambaFusion/dataset/Zurich-RAW-to-RGB
    num_frames: 14
    phase: train
    scale: 8
    # 2 (not 4) because the fusion stage now runs at 96x96: each stage-1
    # SpatioTemporalBlock holds a B x 144 windows x 4 heads x 896^2 attention
    # matrix, and there are 3 of them. If this OOMs, go to 1 and raise
    # accumulation_steps to 8 — that keeps the effective batch at 32.
    batch_size_per_gpu: 2
    num_worker_per_gpu: 6
    dataset_enlarge_ratio: 1
    grad_clip_norm: 1

  val:
    name: SyntheticBurst_val
    type: SyntheticBurstDataset
    # Official pre-generated 300-burst val set (expects bursts/ and gt/)
    dataroot: /groups/rls/blozanod/MambaFusion/dataset/SyntheticBurstVal
    num_frames: 14
    phase: val
    scale: 8

# Network
network_g:
  type: MambaFusionNet
  # General Config
  global_skip: false
  pre_align: true  # <- the domain switch; false reproduces the packed-RGGB pipeline
  num_frames: 14
  img_size: 48  # packed LR crop; PreAlign doubles it to 96 internally
  num_feat: 64
  # Alignment Specific Config
  offset_groups: 4
  # Fusion Specific Config
  fusion_ws: 8
  # SpatioTemporalBlock only. Its attention is B*H^2*heads*N^2*ws^2 — linear
  # in ws^2 and ~14x a SpatialBlock — so 8 -> 4 cuts the dominant memory term
  # 4x (96 -> 24 windows). It is also the only block doing cross-frame spatial
  # search, so this size measures how much residual misalignment fusion is
  # absorbing. Omit the key to fall back to fusion_ws.
  fusion_st_ws: 4
  fusion_feat: 96
  fusion_mlp_ratio: 4
  fusion_heads: 4
  fusion_overlap: 0.25
  fusion_depth_s1: 3
  fusion_depth_s3: 1
  # MambaIRv2 Specific Config
  embed_dim: 96
  upsample_feat: 64  # width of conv_before_upsample -> Upsample -> conv_last
  d_state: 16
  scale: 8  # packed-LR -> GT ratio; restoration upsamples by scale // 2
  depths: [2, 2, 2, 2]
  num_heads: [4, 4, 4, 4]
  window_size: 16
  inner_rank: 32
  num_tokens: 64
  convffn_kernel_size: 5
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  is_train: true

# Training
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: ~

train:
  accumulation_steps: 4  # 2 x 4 GPUs x 4 = effective batch 32, matches L3
  total_iter: 35000
  warmup_iter: 2000
  compand: false  # plain L1 on linear RGB, no mu-law companding

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  # Cosine 1e-4 -> 1e-6 over the whole run, single period, no restart.
  # Replaces MultiStepLR, whose unset gamma defaulted to 0.1 and drove the L3
  # run down to 1e-7 for its last 15k iterations.
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [35000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  # No edge_opt: every nonstandard knob stays at its literature setting;
  # edge terms return later as labeled ablations.

# Validation
val:
  val_freq: 2500
  save_img: false
  metrics:
    psnr_synburst:  # headline: official SyntheticBurst eval (vendored DBSR code)
      type: calculate_psnr_synburst
      boundary_ignore: 40
      better: higher
    psnr_linear:  # ours, kept alongside
      type: calculate_psnr_linear
      crop_border: 40
      test_y_channel: false
      better: higher
    ssim:  # ours (linear-domain SSIM), kept alongside
      type: calculate_ssim
      crop_border: 40
      input_order: CHW  # visuals are [C,H,W]; calculate_ssim defaults to HWC
      test_y_channel: false
      better: higher

# Logging
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: false
